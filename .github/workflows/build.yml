name: Build payload.so

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Build release
        run: ./gradlew assembleRelease

      - name: Upload payload.so
        uses: actions/upload-artifact@v4
        with:
          name: payload-arm64-v8a
          path: app/build/**/libpayload.so
          if-no-files-found: error
