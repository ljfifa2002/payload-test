name: Build payload.so

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Build release
        run: ./gradlew assembleRelease

      - name: Collect dependency libs
        run: |
          mkdir -p app/build/outputs/payload-libs/arm64-v8a
          cp app/build/intermediates/stripped_native_libs/release/**/arm64-v8a/libpayload.so \
             app/build/outputs/payload-libs/arm64-v8a/ 2>/dev/null || \
          find app/build/intermediates/stripped_native_libs -name "libpayload.so" \
             -exec cp {} app/build/outputs/payload-libs/arm64-v8a/ \;
          find ~/.gradle/caches/transforms-4 -name "liblsplant.so" -path "*/arm64-v8a/*" \
             | head -1 | xargs -I{} cp {} app/build/outputs/payload-libs/arm64-v8a/
          find ~/.gradle/caches/transforms-4 -name "libshadowhook.so" -path "*/arm64-v8a/*" \
             | head -1 | xargs -I{} cp {} app/build/outputs/payload-libs/arm64-v8a/
          ls -la app/build/outputs/payload-libs/arm64-v8a/

      - name: Upload payload libs
        uses: actions/upload-artifact@v4
        with:
          name: payload-arm64-v8a
          path: app/build/outputs/payload-libs/arm64-v8a/
          if-no-files-found: error
