name: Build payload.so

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Extract LSPlant 6.4 (headers + library before CMake runs)
        run: |
          curl -sL "https://repo1.maven.org/maven2/org/lsposed/lsplant/lsplant-standalone/6.4/lsplant-standalone-6.4.aar" \
            -o /tmp/lsplant6.aar

          # Headers — needed by CMake at configure time
          mkdir -p app/src/main/cpp/lsplant/include
          unzip -p /tmp/lsplant6.aar \
            prefab/modules/lsplant/include/lsplant.hpp \
            > app/src/main/cpp/lsplant/include/lsplant.hpp

          # Library — needed by CMake at link time
          mkdir -p app/src/main/jniLibs/arm64-v8a
          unzip -p /tmp/lsplant6.aar \
            prefab/modules/lsplant/libs/android.arm64-v8a/liblsplant.so \
            > app/src/main/jniLibs/arm64-v8a/liblsplant.so

          echo "LSPlant header: $(wc -c < app/src/main/cpp/lsplant/include/lsplant.hpp) bytes"
          echo "LSPlant .so:    $(wc -c < app/src/main/jniLibs/arm64-v8a/liblsplant.so) bytes"

      - name: Build release
        run: ./gradlew assembleRelease

      - name: Collect dependency libs
        run: |
          mkdir -p app/build/outputs/payload-libs/arm64-v8a

          # libpayload.so (stripped release)
          find app/build/intermediates/stripped_native_libs -name "libpayload.so" \
            -exec cp {} app/build/outputs/payload-libs/arm64-v8a/ \;

          # liblsplant.so — already extracted above
          cp app/src/main/jniLibs/arm64-v8a/liblsplant.so \
             app/build/outputs/payload-libs/arm64-v8a/liblsplant.so

          # libshadowhook.so — from Gradle transforms cache
          find ~/.gradle/caches/transforms-4 -name "libshadowhook.so" -path "*/arm64-v8a/*" \
            | head -1 | xargs -I{} cp {} app/build/outputs/payload-libs/arm64-v8a/

          ls -la app/build/outputs/payload-libs/arm64-v8a/

      - name: Build hooker.dex
        run: |
          ANDROID_JAR="$ANDROID_SDK_ROOT/platforms/android-35/android.jar"
          D8="$ANDROID_SDK_ROOT/build-tools/$(ls $ANDROID_SDK_ROOT/build-tools | sort -V | tail -1)/d8"

          echo "Using android.jar: $ANDROID_JAR"
          echo "Using d8: $D8"

          mkdir -p /tmp/hooker_classes /tmp/hooker_out
          javac --release 11 \
                -classpath "$ANDROID_JAR" \
                -d /tmp/hooker_classes \
                app/src/main/java/com/pecker/payload/HookerBridge.java

          "$D8" --min-api 21 \
                --output /tmp/hooker_out \
                --lib "$ANDROID_JAR" \
                $(find /tmp/hooker_classes -name "*.class")

          mv /tmp/hooker_out/classes.dex \
             app/build/outputs/payload-libs/arm64-v8a/hooker.dex

          ls -la app/build/outputs/payload-libs/arm64-v8a/

      - name: Upload payload libs
        uses: actions/upload-artifact@v4
        with:
          name: payload-arm64-v8a
          path: app/build/outputs/payload-libs/arm64-v8a/
          if-no-files-found: error
