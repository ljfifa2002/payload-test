name: Build payload.so

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Extract LSPlant 6.4 (headers + libraries for both ABIs)
        run: |
          curl -sL "https://repo1.maven.org/maven2/org/lsposed/lsplant/lsplant-standalone/6.4/lsplant-standalone-6.4.aar" \
            -o /tmp/lsplant6.aar

          # Headers — needed by CMake at configure time (shared across ABIs)
          mkdir -p app/src/main/cpp/lsplant/include
          unzip -p /tmp/lsplant6.aar \
            prefab/modules/lsplant/include/lsplant.hpp \
            > app/src/main/cpp/lsplant/include/lsplant.hpp

          # arm64-v8a library
          mkdir -p app/src/main/jniLibs/arm64-v8a
          unzip -p /tmp/lsplant6.aar \
            prefab/modules/lsplant/libs/android.arm64-v8a/liblsplant.so \
            > app/src/main/jniLibs/arm64-v8a/liblsplant.so

          # armeabi-v7a library
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          unzip -p /tmp/lsplant6.aar \
            prefab/modules/lsplant/libs/android.armeabi-v7a/liblsplant.so \
            > app/src/main/jniLibs/armeabi-v7a/liblsplant.so

          echo "LSPlant header: $(wc -c < app/src/main/cpp/lsplant/include/lsplant.hpp) bytes"
          echo "LSPlant arm64: $(wc -c < app/src/main/jniLibs/arm64-v8a/liblsplant.so) bytes"
          echo "LSPlant arm32: $(wc -c < app/src/main/jniLibs/armeabi-v7a/liblsplant.so) bytes"

      - name: Build release
        run: ./gradlew assembleRelease

      - name: Collect dependency libs
        run: |
          for ABI in arm64-v8a armeabi-v7a; do
            mkdir -p app/build/outputs/payload-libs/$ABI

            # libpayload.so (stripped release)
            find app/build/intermediates/stripped_native_libs -name "libpayload.so" -path "*/$ABI/*" \
              -exec cp {} app/build/outputs/payload-libs/$ABI/ \;

            # liblsplant.so — already extracted above
            cp app/src/main/jniLibs/$ABI/liblsplant.so \
               app/build/outputs/payload-libs/$ABI/liblsplant.so

            # libshadowhook.so — from Gradle transforms cache
            find ~/.gradle/caches/transforms-4 -name "libshadowhook.so" -path "*/$ABI/*" \
              | head -1 | xargs -I{} cp {} app/build/outputs/payload-libs/$ABI/ || true

            echo "$ABI: $(ls app/build/outputs/payload-libs/$ABI/)"
          done

      - name: Build hooker.dex
        run: |
          ANDROID_JAR="$ANDROID_SDK_ROOT/platforms/android-35/android.jar"
          D8="$ANDROID_SDK_ROOT/build-tools/$(ls $ANDROID_SDK_ROOT/build-tools | sort -V | tail -1)/d8"

          echo "Using android.jar: $ANDROID_JAR"
          echo "Using d8: $D8"

          mkdir -p /tmp/hooker_classes /tmp/hooker_out
          javac --release 11 \
                -classpath "$ANDROID_JAR" \
                -d /tmp/hooker_classes \
                app/src/main/java/com/pecker/payload/HookerBridge.java

          "$D8" --min-api 21 \
                --output /tmp/hooker_out \
                --lib "$ANDROID_JAR" \
                $(find /tmp/hooker_classes -name "*.class")

          # hooker.dex is architecture-independent — place at top level
          mv /tmp/hooker_out/classes.dex app/build/outputs/payload-libs/hooker.dex

          echo "hooker.dex: $(wc -c < app/build/outputs/payload-libs/hooker.dex) bytes"

      - name: Update file timestamps to Shanghai time
        run: |
          # ZIP stores timestamps as "local time" with no timezone marker.
          # The CI runner is UTC, so a plain `touch` stores UTC time, which
          # extractors show as UTC+0. To make extracted files display Beijing
          # time (UTC+8) on any machine, set mtime = current UTC + 8 h so
          # the stored "local" value matches what a Beijing clock would show.
          BEIJING_TS=$(date -u -d '+8 hours' +%Y%m%d%H%M.%S)
          find app/build/outputs/payload-libs -type f | xargs touch -t "$BEIJING_TS"
          echo "Timestamps set to: $(date -u -d '+8 hours' '+%Y-%m-%d %H:%M:%S CST')"

      - name: Upload arm64-v8a payload libs
        uses: actions/upload-artifact@v4
        with:
          name: payload-arm64-v8a
          path: app/build/outputs/payload-libs/arm64-v8a/
          if-no-files-found: error

      - name: Upload armeabi-v7a payload libs
        uses: actions/upload-artifact@v4
        with:
          name: payload-armeabi-v7a
          path: app/build/outputs/payload-libs/armeabi-v7a/
          if-no-files-found: error

      - name: Upload hooker.dex (arch-independent)
        uses: actions/upload-artifact@v4
        with:
          name: payload-common
          path: app/build/outputs/payload-libs/hooker.dex
          if-no-files-found: error
