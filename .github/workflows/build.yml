name: Build payload.so

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Inject version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${{ github.ref_name }}"
          sed -i "s|#define PAYLOAD_VERSION \".*\"|#define PAYLOAD_VERSION \"${VERSION}\"|" \
            app/src/main/cpp/main.cpp
          echo "payload: PAYLOAD_VERSION set to ${VERSION}"
          grep "PAYLOAD_VERSION" app/src/main/cpp/main.cpp

      - name: Verify LSPlant libraries (committed to repo, no download needed)
        run: |
          # liblsplant.so for both ABIs are committed directly to jniLibs/
          # (custom build with Android 15 DoCollection fix, replacing Maven Central 6.4)
          echo "LSPlant arm64: $(wc -c < app/src/main/jniLibs/arm64-v8a/liblsplant.so) bytes"
          echo "LSPlant arm32: $(wc -c < app/src/main/jniLibs/armeabi-v7a/liblsplant.so) bytes"
          # lsplant.hpp header is also committed under app/src/main/cpp/lsplant/include/
          echo "LSPlant header: $(wc -c < app/src/main/cpp/lsplant/include/lsplant.hpp) bytes"

      - name: Build release
        run: ./gradlew assembleRelease

      - name: Collect dependency libs
        run: |
          for ABI in arm64-v8a armeabi-v7a; do
            mkdir -p app/build/outputs/payload-libs/$ABI

            # libpayload.so (stripped release)
            find app/build/intermediates/stripped_native_libs -name "libpayload.so" -path "*/$ABI/*" \
              -exec cp {} app/build/outputs/payload-libs/$ABI/ \;

            # liblsplant.so — already extracted above
            cp app/src/main/jniLibs/$ABI/liblsplant.so \
               app/build/outputs/payload-libs/$ABI/liblsplant.so

            # libshadowhook.so — from Gradle transforms cache
            find ~/.gradle/caches/transforms-4 -name "libshadowhook.so" -path "*/$ABI/*" \
              | head -1 | xargs -I{} cp {} app/build/outputs/payload-libs/$ABI/ || true

            echo "$ABI: $(ls app/build/outputs/payload-libs/$ABI/)"
          done

      - name: Build hookere.dex (string-encoded + AES-encrypted)
        run: |
          ANDROID_JAR="$ANDROID_SDK_ROOT/platforms/android-35/android.jar"
          D8="$ANDROID_SDK_ROOT/build-tools/$(ls $ANDROID_SDK_ROOT/build-tools | sort -V | tail -1)/d8"
          echo "Using android.jar: $ANDROID_JAR"
          echo "Using d8: $D8"

          mkdir -p /tmp/hooker_classes /tmp/hooker_out

          # 1) Compile Obf (runtime decoder) + HookerBridge together. HookerBridge
          #    now calls Obf.s("..."), so Obf.java MUST be on the same javac line.
          javac --release 11 \
                -classpath "$ANDROID_JAR" \
                -d /tmp/hooker_classes \
                app/src/main/java/com/pecker/payload/Obf.java \
                app/src/main/java/com/pecker/payload/HookerBridge.java

          # 2) String encoding (protection item 4): rewrite the Obf.s("literal")
          #    constants to encoded form on the .class files BEFORE d8. hooker.dex
          #    is built outside Gradle, so the AGP instrumentation API can't reach
          #    it — this standalone ASM pass is what actually encodes the dex.
          ASM_V=9.6
          curl -sSL -o /tmp/asm.jar      https://repo1.maven.org/maven2/org/ow2/asm/asm/${ASM_V}/asm-${ASM_V}.jar
          curl -sSL -o /tmp/asm-tree.jar https://repo1.maven.org/maven2/org/ow2/asm/asm-tree/${ASM_V}/asm-tree-${ASM_V}.jar
          javac -cp /tmp/asm.jar:/tmp/asm-tree.jar -d /tmp tools/ObfTransform.java
          java  -cp /tmp:/tmp/asm.jar:/tmp/asm-tree.jar ObfTransform /tmp/hooker_classes

          # 3) d8 -> classes.dex (arch-independent)
          "$D8" --min-api 21 \
                --output /tmp/hooker_out \
                --lib "$ANDROID_JAR" \
                $(find /tmp/hooker_classes -name "*.class")

          # 4) AES-256-CTR encrypt (protection item 1): classes.dex -> hookere.dex.
          #    The 'e'-before-ext name hides the .enc suffix (matches hook_apke.js).
          #    enc_dex KEY must match libpayload.so DEX_KEY (built above by CMake
          #    from the same aes.c). The plaintext dex is NEVER shipped.
          cc -O2 -Iapp/src/main/cpp tools/enc_dex.c app/src/main/cpp/aes.c -o /tmp/enc_dex
          /tmp/enc_dex /tmp/hooker_out/classes.dex app/build/outputs/payload-libs/hookere.dex

          echo "hookere.dex: $(wc -c < app/build/outputs/payload-libs/hookere.dex) bytes"

      - name: Package artifacts with Beijing timestamps
        run: |
          # actions/upload-artifact re-packages files on GitHub's servers (UTC),
          # resetting internal timestamps regardless of what touch sets on disk.
          # Solution: create the zip manually with Python, explicitly setting the
          # ZipInfo.date_time field to Beijing time. Upload the ready-made zip as
          # a single-file artifact so GitHub's re-packaging never touches the
          # internal timestamps.
          python3 - <<'PYEOF'
          import zipfile, time, os, glob

          # TZ=Asia/Shanghai is active: time.localtime() returns Beijing time.
          t = time.localtime()
          dt = (t.tm_year, t.tm_mon, t.tm_mday, t.tm_hour, t.tm_min, t.tm_sec)
          print(f"Packaging with timestamp: {t.tm_year}-{t.tm_mon:02d}-{t.tm_mday:02d} {t.tm_hour:02d}:{t.tm_min:02d}:{t.tm_sec:02d} CST")

          def pack(zip_path, base_dir):
              os.makedirs(os.path.dirname(zip_path), exist_ok=True)
              with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED) as zf:
                  for path in sorted(glob.glob(os.path.join(base_dir, '*'))):
                      if os.path.isfile(path):
                          info = zipfile.ZipInfo(os.path.basename(path), date_time=dt)
                          info.compress_type = zipfile.ZIP_DEFLATED
                          with open(path, 'rb') as f:
                              zf.writestr(info, f.read())
                          print(f"  + {os.path.basename(path)}")

          pack('app/build/outputs/zips/payload-arm64-v8a.zip',
               'app/build/outputs/payload-libs/arm64-v8a')
          pack('app/build/outputs/zips/payload-armeabi-v7a.zip',
               'app/build/outputs/payload-libs/armeabi-v7a')

          # hookere.dex — single file, put it in a zip too for consistency
          dex = 'app/build/outputs/payload-libs/hookere.dex'
          with zipfile.ZipFile('app/build/outputs/zips/payload-common.zip', 'w', zipfile.ZIP_DEFLATED) as zf:
              info = zipfile.ZipInfo('hookere.dex', date_time=dt)
              info.compress_type = zipfile.ZIP_DEFLATED
              with open(dex, 'rb') as f:
                  zf.writestr(info, f.read())
          print("  + hookere.dex")
          PYEOF

      - name: Upload arm64-v8a payload libs
        uses: actions/upload-artifact@v4
        with:
          name: payload-arm64-v8a
          path: app/build/outputs/zips/payload-arm64-v8a.zip
          if-no-files-found: error

      - name: Upload armeabi-v7a payload libs
        uses: actions/upload-artifact@v4
        with:
          name: payload-armeabi-v7a
          path: app/build/outputs/zips/payload-armeabi-v7a.zip
          if-no-files-found: error

      - name: Upload hookere.dex (arch-independent)
        uses: actions/upload-artifact@v4
        with:
          name: payload-common
          path: app/build/outputs/zips/payload-common.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/zips/payload-arm64-v8a.zip
            app/build/outputs/zips/payload-armeabi-v7a.zip
            app/build/outputs/zips/payload-common.zip
          name: payload ${{ github.ref_name }}
          body: |
            libpayload.so + hookere.dex build for pecker-agent peckerd mode.

            ## Files
            - `payload-arm64-v8a.zip` — libpayload.so + liblsplant.so + libshadowhook.so (arm64)
            - `payload-armeabi-v7a.zip` — same for arm32
            - `payload-common.zip` — hookere.dex (string-encoded + AES-256-CTR, arch-independent)
